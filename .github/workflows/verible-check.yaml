name: Verible Verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  verible-ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Verible Linter
      uses: chipsalliance/verible-linter-action@main
      with:
        config_file: '.rules.verible_lint'
        extensions: |
          .sv
          .v
          .vh
          .svh
        github_token: ${{ secrets.GITHUB_TOKEN }}

    - name: Check Formatting
      run: |
        git fetch origin ${{ github.base_ref }} --depth=1

        FILES=$(git diff --name-only origin/${{ github.base_ref }} | grep -E '\.(v|sv|vh|svh)$' || true)

        if [ -n "$FILES" ]; then
          echo "Checking formatting for:"
          echo "$FILES"
          verible-verilog-format --verify --flagfile=.rules.verible_format $FILES
        else
          echo "No Verilog/SystemVerilog files modified. Skipping check."
        fi
