name: Pull Request Checks

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  # ----------------------------------------------------------------------------
  # 1. Commit Message Convention Check (Conventional Commits)
  # ----------------------------------------------------------------------------
  commit-lint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Conventional Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json

  # ----------------------------------------------------------------------------
  # 2. General Pre-commit Checks (Whitespace, EOF, YAML, Ruff)
  # ----------------------------------------------------------------------------
  pre-commit:
    name: Code Hygiene & Formatting
    needs: commit-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pre-commit
        run: pip install --upgrade pip pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Run pre-commit hooks
        run: |
          SKIP=verible-format,verible-lint pre-commit run --all-files --show-diff-on-failure

  # ----------------------------------------------------------------------------
  # 3. SystemVerilog Linting & Formatting Check (Verible in ALU Digital UDE)
  # ----------------------------------------------------------------------------
  verible-ci:
    name: Verible Lint & Format
    needs: pre-commit
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agh-logic-unit/alu-rtl:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check SystemVerilog & Python Lint
        run: just lint

      - name: Check SystemVerilog Formatting
        run: |
          just fmt
          git diff --exit-code || (echo "❌ Formatting issues detected! Please run 'just fmt' locally." && exit 1)

  # ----------------------------------------------------------------------------
  # 4. RTL Verification (Cocotb + Pytest in ALU Digital UDE Container)
  # ----------------------------------------------------------------------------
  test-rtl:
    name: RTL Simulation (Cocotb + Pytest)
    needs: verible-ci
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/agh-logic-unit/alu-rtl:latest
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure safe git directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Pytest Cocotb test suite
        run: |
          just test-parallel

      - name: Archive simulation artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-failure-logs
          path: |
            sim_build/
            results.xml
            *.vcd
            *.fst
