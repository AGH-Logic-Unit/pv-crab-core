default_install_hook_types:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=10000']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-license
        name: Check license headers
        entry: python scripts/check_license.py
        language: python
        files: \.(sv|v|svh|vh|py)$
        exclude: ^vendor/

      - id: verible-format
        name: Verible verilog format
        entry: verible-verilog-format
        language: system
        types_or: [verilog, system-verilog]
        args: [--flagfile, .rules.verible_format, --inplace]

      - id: verible-lint
        name: Verible verilog lint
        entry: verible-verilog-lint
        language: system
        types_or: [verilog, system-verilog]
        args: [--rules_config, .rules.verible_lint]
